# A 2D panel app (mcx-build): src/**/*.java -> javac (--release 17) -> D8 -> classes.dex. Optional keys:
#   JAVA_RELEASE=17     the Java language level javac compiles for (D8 lowers it for minSdkVersion)
#   JAVACFLAGS=...      extra javac flags (for example -Xlint:unchecked)
# Plain Java libraries: put their .jar files in libs/ (no .aar, no Gradle).
TYPE=panel
